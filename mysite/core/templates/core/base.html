{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MySite{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}?v=2" />
  </head>
  <body>
    <header>
      <div class="logo">My<span>Site</span></div>
      <nav>
        <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'guestbook' %}" class="nav-link {% if request.resolver_match.url_name == 'guestbook' %}active{% endif %}">Guestbook</a>
      </nav>
    </header>

    <main>{% block content %} {% endblock %}</main>

    <footer>
      <p>&copy; {% now "Y" %} MySite. Crafted with precision. (Deployed Check: OK)</p>
    </footer>
  </body>
</html>
